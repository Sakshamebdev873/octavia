name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mongo:
        image: mongo:8
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 5s --health-timeout 5s --health-retries 20
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: flowlet
          POSTGRES_PASSWORD: flowlet
          POSTGRES_DB: flowlet
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U flowlet -d flowlet"
          --health-interval 5s --health-timeout 5s --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      # The same commands a reviewer runs from a fresh clone (minus docker compose,
      # replaced by the service containers above).
      - run: cp .env.example .env
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run migrate
      - run: bun test
